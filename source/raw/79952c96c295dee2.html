<div id="cms_update_introduction" class="hidden">
    <div id="cms_update_introduction_overlay"></div> 
    <div id="cms_update_introduction_content" class="clearwithin">
        <div class="close"></div>
        <div id="cms_update_introduction_content_area"></div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#cms_update_introduction_button, #cms_update_introduction_overlay, #cms_update_introduction_content .close').click(function() {
            window.setTimeout(function() {
                $('#cms_update_introduction').removeClass('visible');
                window.setTimeout(function() {
                    $('#cms_update_introduction').removeClass('active');
                }, 1000);
            }, timeout);
            return false;
        });
        
        show_data_controller_popup = function() {
            // Data controller popup
            $('#cms_update_introduction_content_area').html($('#cms_popup_content_data_controller').html());
            
            window.setTimeout(function() {
                $('#cms_update_introduction').addClass('active');
                window.setTimeout(function() {
                    $('#cms_update_introduction').addClass('visible');
                }, 20);
            }, timeout);
            
            window.edit.set_cookie('cms_data_controller_popop', 'true', 1);
            
            $("#dc-overlay-close").bind("click", function(event) {
            	$('#cms_update_introduction_content .close').trigger('click');
            });
        };
        
        if ($('#cms_popup_content_getting_started').length && (window.edit.get_cookie('cms_getting_started_popop') != 'true' || window.location.search == '?force_introduction_popup=1')) {
            // Show getting started popup
            var timeout = 0;
            $('#cms_update_introduction_content_area').html($('#cms_popup_content_getting_started').html());
            window.setTimeout(function() {
                $('#cms_update_introduction').addClass('active');
                window.setTimeout(function() {
                    $('#cms_update_introduction').addClass('visible');
                }, 20);
            }, timeout);
            window.edit.set_cookie('cms_getting_started_popop', 'true', 180);
        } else if ($('#cms_popup_content_cookie_banner').length && (window.edit.get_cookie('cms_cookie_banner_popup') != 'true' || window.location.search == '?force_introduction_popup=1')) {
            // Show getting started popup
            var timeout = 0;
            $('#cms_update_introduction_content_area').html($('#cms_popup_content_cookie_banner').html());
            window.setTimeout(function() {
                $('#cms_update_introduction').addClass('active');
                window.setTimeout(function() {
                    $('#cms_update_introduction').addClass('visible');
                }, 20);
            }, timeout);
            window.edit.set_cookie('cms_cookie_banner_popup', 'true', 180);
        } else if ($('#cms_popup_content_data_protection').length && (window.edit.get_cookie('cms_dpa_dec_2020_notification_popup') != 'true' || window.location.search == '?force_introduction_popup=2')) {
            // Show data protection popup
            var timeout = 0;
            $('#cms_update_introduction_content_area').html($('#cms_popup_content_data_protection').html());
            $('#cms_popup_content_data_protection *').each(function() {
                if (typeof $(this).attr('id') != 'undefined' && $(this).attr('id')) {
                    $(this).attr('id', 'duplicate-' + $(this).attr('id'));
                } 
            });
            
            function dpa_check_fields() {
                if (!$("#dpa-agree").is(':checked') || !$('#dpa-link').hasClass('clicked') || $('#dpa-fields input').filter(function() {
					return !this.value;
				}).length > 0) {
                    $("#dpa-overlay-submit").addClass("disabled");
                    $("#dpa-overlay-submit").closest('li').removeClass('squarebtns_always_highlight');
                } else {
                    $("#dpa-overlay-submit").removeClass("disabled");
                    $("#dpa-overlay-submit").closest('li').addClass('squarebtns_always_highlight');
                }
            };
            
            $("#dpa-link").bind("click", function(event) {
                $('#dpa-link').addClass('clicked');
                $("#dpa-download-expl").hide();
                $('#dpa-container .note_panel').removeClass('note_panel_error');
                dpa_check_fields();
            });
            $("#dpa-overlay-submit").bind("click", function(event) {
            	if ($(this).hasClass('disabled')) {
            	    if (!$('#dpa-link').hasClass('clicked')) {
                		$('#dpa-container .note_panel').addClass('note_panel_error');
            	    }
                	h.alert('<h2>Sorry</h2>Please ensure you have downloaded a copy of the Data Protection Addendum and filled out all the required fields.');
            	} else {
            		data = '';
            		if (!$(this).hasClass('submitting')) {
                        $(this).addClass('submitting loading');
                        $('#dpa-container input[type="text"], #dpa-container input[type="hidden"]').each(function() {
                            var field_value = $(this).val();
                            data = data + $(this).attr('name') + '=' + field_value + '&';
                        });
    
                        $.ajax({
                            url: "/admin/compliance/add/",
                            data: data,
                            cache: false,
                            method: 'POST',
                            dataType: 'json',
                            success: function(data) {
                                $(this).removeClass('submitting loading');
                                if (data['success']) {
                                    $('#cms_update_introduction_content .close').trigger('click');
                                    h.alert('<h2>Thank you</h2>You have succesfully agreed to the new Data Processing Addendum and your details have been logged.')
                                } else {
                                    h.alert('<h2>Sorry</h2>Your details could not be logged. Please try again ensuring you have downloaded a copy of the Data Protection Addendum and filled out all the required fields.')
                                }
                                
                                
                            },
                            error: function(data) {
                                $(this).removeClass('submitting loading');
                                h.alert('<h2>Sorry</h2>Your details could not be logged. Please try again ensuring you have downloaded a copy of the Data Protection Addendum and filled out all the required fields.')
                            }
                        });
            		}
                    
            	}
            });
            $("#dpa-overlay-close").bind("click", function(event) {
            	$('#cms_update_introduction_content .close').trigger('click');
            });
            $("#dpa-agree").bind("change", function(event) {
                dpa_check_fields();
            }).trigger('change');
            
            $("#dpa-fields input").bind("change, keyup", function(event) {
                dpa_check_fields();
            }).trigger('change');
            
            window.setTimeout(function() {
                $('#cms_update_introduction').addClass('active');
                window.setTimeout(function() {
                    $('#cms_update_introduction').addClass('visible');
                }, 20);
            }, timeout);
            window.edit.set_cookie('cms_dpa_dec_2020_notification_popup', 'true', 1);
            
            
        } else if ($('#cms_popup_content_data_controller').length && (window.edit.get_cookie('cms_data_controller_popop') != 'true' || window.location.search == '?force_introduction_popup=3')) {
            
            show_data_controller_popup();
            
        }
        
    });
</script>
